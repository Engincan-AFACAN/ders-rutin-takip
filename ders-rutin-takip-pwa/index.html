<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2463eb">
  <meta name="description" content="Derslerini, odak süreni, görevlerini ve alışkanlıklarını tek yerden takip et.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ders & Rutin">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>Ders & Rutin — Çalışma Takibi</title>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" aria-label="Ana menü">
    <a class="brand" href="#anasayfa" aria-label="Ders ve Rutin ana sayfa">
      <span class="brand-icon" aria-hidden="true">✦</span>
      <span><strong>Ders & Rutin</strong><small>Planla. Odaklan. İlerle.</small></span>
    </a>
    <div class="nav-heading">ÇALIŞMA ALANI</div>
    <nav class="side-nav" id="desktopNav">
      <button class="nav-link active" type="button" data-tab="anasayfa"><span class="nav-symbol">⌂</span> Genel Bakış</button>
      <button class="nav-link" type="button" data-tab="plan"><span class="nav-symbol">▦</span> Planım</button>
      <button class="nav-link" type="button" data-tab="istatistik"><span class="nav-symbol">◷</span> İstatistikler</button>
      <button class="nav-link" type="button" data-tab="ayarlar"><span class="nav-symbol">⚙</span> Ayarlar</button>
    </nav>
    <div class="side-footer">
      <div class="side-tip"><div class="tip-emoji">✧</div><strong>Küçük adımlar, büyük ilerleme.</strong><p>Bugün için tek bir odak oturumu bile değerlidir.</p></div>
      <div class="privacy-note">🔒 Üyelik yok · Verilerin bu cihazda</div>
    </div>
  </aside>

  <div class="content-column">
    <header class="topbar">
      <div class="topbar-label"><span class="blue-dot"></span><span>ÇALIŞMA PANELİ</span></div>
      <div class="topbar-actions">
        <span id="syncStatus" class="save-state">● Bu cihazda kayıtlı</span>
        <button class="icon-button" type="button" id="goToday" title="Bugüne git" aria-label="Bugüne git">↻</button>
      </div>
    </header>
    <main class="main-content" id="view" aria-live="polite"></main>
    <footer class="site-footer">Ders & Rutin <span>•</span> Basit, kişisel ve çevrimdışı çalışabilen çalışma alanın.</footer>
  </div>
</div>

<nav class="bottom-nav" aria-label="Mobil menü">
  <button type="button" data-tab="anasayfa" class="active"><span>⌂</span><small>Ana Sayfa</small></button>
  <button type="button" data-tab="plan"><span>▦</span><small>Planım</small></button>
  <button type="button" data-tab="istatistik"><span>◷</span><small>İlerleme</small></button>
  <button type="button" data-tab="ayarlar"><span>⚙</span><small>Ayarlar</small></button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal-overlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h2 id="modalTitle">Başlık</h2><button class="icon-button" id="closeModal" type="button" aria-label="Kapat">✕</button></div>
    <div id="modalContent"></div>
  </div>
</div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<script defer src="./app.js"></script>
</body>
</html>
